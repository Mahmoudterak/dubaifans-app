<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virality Predictor (local)</title>
<style>
:root {
  --bg:#0a1a1f; --grid:rgba(79,183,176,.06); --panel:#0e2228; --panel2:#11292f;
  --line:#2a4d55; --text:#e8f4f4; --muted:#86a4aa; --teal:#4fb7b0; --teal2:#8fe0d9;
  --gold:#f2b544; --red:#e08b7f;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#eef5f5; --grid:rgba(20,80,85,.06); --panel:#ffffff; --panel2:#f4fafa;
    --line:#c7dbdd; --text:#0f2529; --muted:#557077; --teal:#2f9f98; --teal2:#1f7f79; --gold:#c98b12; --red:#b85a4f;
  }
}
:root[data-theme="dark"] {
  --bg:#0a1a1f; --grid:rgba(79,183,176,.06); --panel:#0e2228; --panel2:#11292f;
  --line:#2a4d55; --text:#e8f4f4; --muted:#86a4aa; --teal:#4fb7b0; --teal2:#8fe0d9; --gold:#f2b544; --red:#e08b7f;
}
* { box-sizing: border-box; }
html, body { margin:0; }
body {
  background: var(--bg); color: var(--text);
  font-family: system-ui, "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif;
  min-height: 100vh;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
}
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 56px; }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom: 18px; }
.brand { font-size: 13px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }
.brand b { color: var(--teal2); font-weight: 700; }
.tools { display:flex; gap:8px; }
.btn {
  background: var(--panel2); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
}
.btn:hover { border-color: var(--teal); }
.btn.primary { background: var(--teal); color: #042025; border-color: var(--teal); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }

.drop {
  display: block; background: var(--panel); border: 1.5px dashed var(--line); border-radius: 18px;
  padding: 30px 18px; text-align: center; cursor: pointer; transition: border-color .15s;
}
.drop.over, .drop:hover { border-color: var(--teal); }
.drop strong { display:block; font-size: 17px; margin-bottom: 6px; }
.drop span { color: var(--muted); font-size: 13px; }
input[type=file] { display: none; }

.stage { display:grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
@media (min-width: 760px) { .stage { grid-template-columns: 300px 1fr; } }

.phone {
  justify-self: center; width: 260px; max-width: 100%;
  aspect-ratio: 9/16; background: #04121a; border: 2px solid var(--line);
  border-radius: 28px; padding: 10px; position: relative; overflow: hidden;
}
.phone video { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; background:#000; display:block; }
.phone .empty {
  position:absolute; inset: 10px; border-radius: 20px;
  display:grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; padding: 8px;
}
.phone .empty i { background: var(--panel2); border-radius: 10px; }
.phone .tag {
  position:absolute; top: 18px; inset-inline-end: 18px; background: #f4f4f4; color:#111;
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: .05em;
}

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.panel h2 { margin: 0 0 12px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.score { display:flex; align-items:center; gap: 18px; flex-wrap: wrap; }
.ring { width: 118px; height: 118px; flex: none; }
.ring .num { font-size: 40px; font-weight: 800; fill: var(--gold); }
.ring .of { font-size: 14px; fill: var(--muted); }
.score .meta { flex: 1; min-width: 180px; }
.score .meta .big { font-size: 15px; color: var(--text); margin-bottom: 6px; font-weight: 600; }
.score .meta .small { font-size: 13px; color: var(--muted); line-height: 1.6; }
.verdict { display:inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--teal); color: var(--teal2); }
.verdict.low { border-color: var(--red); color: var(--red); }
.verdict.mid { border-color: var(--gold); color: var(--gold); }

.chips { display:grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 16px; }
@media (max-width: 560px) { .chips { grid-template-columns: repeat(3, 1fr); } }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px 8px; text-align:center; }
.chip .t { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; }
.chip .p { font-size: 20px; font-weight: 700; margin: 2px 0 6px; font-variant-numeric: tabular-nums; direction: ltr; }
.chip .b { height: 4px; border-radius: 3px; background: var(--line); overflow: hidden; }
.chip .b i { display:block; height:100%; background: var(--teal); }
.chip.weak { border-color: var(--red); }
.chip.weak .b i { background: var(--red); }

.curve { margin-top: 14px; }
.curve svg { width: 100%; height: 160px; display:block; }

.signals { display:grid; grid-template-columns: 1fr; gap: 14px; }
.sig { display:grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items:center; }
.sig .n { font-size: 15px; }
.sig .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; }
.sig .track { grid-column: 1 / -1; height: 10px; border-radius: 6px; background: var(--line); overflow:hidden; }
.sig .track i { display:block; height:100%; border-radius: 6px; background: linear-gradient(90deg, var(--teal), var(--teal2)); transition: width .6s ease; }

dl { display:grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; direction: ltr; text-align: start; font-variant-numeric: tabular-nums; }

.tips { margin: 0; padding: 0; list-style: none; display:grid; gap: 8px; }
.tips li { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.6; }
.tips li b { color: var(--teal2); }

.status { margin-top: 12px; color: var(--muted); font-size: 14px; min-height: 22px; text-align:center; }
.status.err { color: var(--red); }
.note { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 18px; text-align:center; }
.hidden { display:none !important; }
.progress { height: 6px; background: var(--line); border-radius: 4px; overflow:hidden; margin-top: 10px; }
.progress i { display:block; height:100%; width:0; background: var(--teal); transition: width .2s; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><b>VIRALITY</b> · PREDICTOR</div>
    <div class="tools">
      <button class="btn" id="langBtn" type="button">EN</button>
      <button class="btn" id="pickBtn" type="button">فيديو جديد</button>
      <button class="btn" id="jsonBtn" type="button" disabled>JSON</button>
    </div>
  </header>

  <label class="drop" id="drop">
    <strong data-i="dropTitle">اسحب الفيديو هنا أو اضغط للاختيار</strong>
    <span data-i="dropSub">MP4 · MOV · WebM · يتم التحليل داخل متصفحك، ولا يُرفع الملف إلى أي مكان</span>
    <input type="file" id="file" accept="video/*">
  </label>
  <div class="progress hidden" id="prog"><i></i></div>
  <div class="status" id="status"></div>

  <section class="stage hidden" id="stage">
    <div>
      <div class="phone" id="phone">
        <div class="empty" id="phoneEmpty"><i></i><i></i><i></i><i></i></div>
        <span class="tag" data-i="draft">DRAFT</span>
        <video id="vid" controls playsinline muted></video>
      </div>
    </div>

    <div style="display:grid; gap:16px">
      <div class="panel">
        <h2 data-i="viral">Viral score</h2>
        <div class="score">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="8"></circle>
            <circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="var(--gold)" stroke-width="8"
              stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314" stroke-dashoffset="314"></circle>
            <text x="60" y="66" text-anchor="middle" class="num" id="ringNum">--</text>
          </svg>
          <div class="meta">
            <div class="big" id="verdictTxt">—</div>
            <div class="small" id="metaTxt"></div>
            <span class="verdict" id="verdict">—</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2 data-i="retention">الاحتفاظ المقدّر</h2>
        <div class="chips" id="chips"></div>
        <div class="curve"><svg id="curveSvg" viewBox="0 0 600 160" preserveAspectRatio="none" role="img"></svg></div>
      </div>

      <div class="panel">
        <h2 data-i="signals">الإشارات</h2>
        <div class="signals" id="signals"></div>
      </div>

      <div class="panel">
        <h2 data-i="details">التفاصيل</h2>
        <dl id="details"></dl>
      </div>

      <div class="panel">
        <h2 data-i="tips">ملاحظات للتحسين</h2>
        <ul class="tips" id="tips"></ul>
      </div>
    </div>
  </section>

  <p class="note" id="disclaimer"></p>
</main>

<script>
(() => {
  "use strict";

  // ---------- language ----------
  const T = {
    ar: {
      dropTitle: "اسحب الفيديو هنا أو اضغط للاختيار",
      dropSub: "MP4 · MOV · WebM · يتم التحليل داخل متصفحك، ولا يُرفع الملف إلى أي مكان",
      draft: "DRAFT", viral: "الدرجة الفيروسية", retention: "الاحتفاظ المقدّر",
      signals: "الإشارات", details: "التفاصيل", tips: "ملاحظات للتحسين",
      visual: "البصري", attention: "الانتباه", memory: "الذاكرة", hook: "الافتتاحية (0–3ث)",
      cuts: "القطع", staticTime: "وقت الثبات", contrast: "التباين", colour: "الألوان",
      audio: "ديناميكية الصوت", weakest: "أضعف ثانية", size: "الحجم",
      none: "لا يوجد", loading: "جارٍ التحليل…", analysing: "جارٍ قراءة الإطارات…",
      audioStep: "جارٍ قراءة الصوت…", done: "اكتمل التحليل.", noVideo: "هذا الملف ليس فيديو قابلاً للقراءة.",
      tooLong: "الفيديو أطول من 120 ثانية، ستُحلَّل أول 120 ثانية فقط.",
      err: "تعذر التحليل: ", verdictHigh: "قوي، جاهز للنشر", verdictMid: "متوسط، يحتاج تحسيناً", verdictLow: "ضعيف، أعد النظر في الافتتاحية",
      disclaimer: "تقدير heuristic مبني على الحركة والقطع والتباين والألوان والصوت فقط. ليس نموذج Higgsfield، ولا يقيس الرسالة أو المنشئ أو المنتج أو الجمهور.",
      tipHook: "الافتتاحية ضعيفة. ابدأ بحركة أو قطع أو جملة قوية في أول 3 ثوانٍ.",
      tipStatic: "نسبة الثبات عالية. أضف حركة كاميرا أو قطعاً أكثر لتبقى الانتباه.",
      tipCuts: "لا توجد قطع واضحة. قسّم الفيديو إلى لقطات أقصر.",
      tipContrast: "التباين منخفض. زد الفرق بين الضوء والظل أو الخلفية والموضوع.",
      tipAudio: "الصوت ثابت أو صامت أغلب الوقت. أضف موسيقى أو مؤثرات أو صوتاً متغيراً.",
      tipWeak: "أضعف لحظة هي الثانية {s}. ضع فيها تغييراً أو قطعاً.",
      tipGood: "لا توجد ملاحظات حرجة. راقب أرقام الاحتفاظ على الفيديو الحقيقي.",
      json: "JSON", newVideo: "فيديو جديد", langLabel: "EN"
    },
    en: {
      dropTitle: "Drop a video here or click to choose",
      dropSub: "MP4 · MOV · WebM · analysed inside your browser; the file is never uploaded",
      draft: "DRAFT", viral: "Viral score", retention: "Estimated retention",
      signals: "Signals", details: "Details", tips: "Improvement notes",
      visual: "Visual", attention: "Attention", memory: "Memory", hook: "Hook (0–3s)",
      cuts: "Cuts", staticTime: "Static time", contrast: "Contrast", colour: "Colourfulness",
      audio: "Audio dynamics", weakest: "Weakest second", size: "Size",
      none: "none", loading: "Loading…", analysing: "Reading frames…",
      audioStep: "Reading audio…", done: "Analysis complete.", noVideo: "This file is not a readable video.",
      tooLong: "Video is longer than 120 s; only the first 120 s are analysed.",
      err: "Could not analyse: ", verdictHigh: "Strong, ready to post", verdictMid: "Average, needs work", verdictLow: "Weak, rework the opening",
      disclaimer: "Heuristic estimate from motion, cuts, contrast, colour and loudness only. Not Higgsfield's model; it does not measure the message, creator, product or audience.",
      tipHook: "The opening is weak. Start with motion, a cut or a strong line in the first 3 seconds.",
      tipStatic: "Static time is high. Add camera motion or more cuts to hold attention.",
      tipCuts: "Few or no clear cuts. Split the video into shorter shots.",
      tipContrast: "Contrast is low. Increase the difference between light and shadow or subject and background.",
      tipAudio: "Audio is flat or silent most of the time. Add music, effects or varied voice.",
      tipWeak: "The weakest moment is second {s}. Put a change or a cut there.",
      tipGood: "No critical notes. Check the retention numbers against the real video.",
      json: "JSON", newVideo: "New video", langLabel: "AR"
    }
  };
  let lang = "ar";
  const t = k => T[lang][k] ?? k;

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
    document.getElementById("langBtn").textContent = T[lang].langLabel;
    document.getElementById("pickBtn").textContent = t("newVideo");
    document.getElementById("jsonBtn").textContent = t("json");
    document.getElementById("disclaimer").textContent = t("disclaimer");
    if (last) render(last);
  }

  // ---------- helpers ----------
  const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
  const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
  const std = a => { if (!a.length) return 0; const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) ** 2))); };
  const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  const SAMPLE_FPS = 2, W = 96, H = 54, CUT_T = 0.35;
  const MAX_SECONDS = 120;

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  function seek(video, time) {
    return new Promise((resolve, reject) => {
      const onSeek = () => { video.removeEventListener("seeked", onSeek); resolve(); };
      const onErr = () => { video.removeEventListener("error", onErr); reject(new Error("seek failed")); };
      video.addEventListener("seeked", onSeek);
      video.addEventListener("error", onErr, { once: true });
      video.currentTime = Math.min(time, Math.max(0, video.duration - 0.05));
    });
  }

  // Read frames at SAMPLE_FPS: returns {gray[][], sat[][], rgbMeanSat}
  async function readFrames(video, duration, onProgress) {
    const n = Math.max(1, Math.floor(duration * SAMPLE_FPS));
    const grays = [], sats = [];
    let satSum = 0, satCount = 0;
    for (let i = 0; i < n; i++) {
      await seek(video, i / SAMPLE_FPS);
      ctx.drawImage(video, 0, 0, W, H);
      const { data } = ctx.getImageData(0, 0, W, H);
      const g = new Float32Array(W * H);
      for (let p = 0, q = 0; p < data.length; p += 4, q++) {
        const r = data[p] / 255, gg = data[p + 1] / 255, b = data[p + 2] / 255;
        g[q] = 0.299 * r + 0.587 * gg + 0.114 * b;
        const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
        satSum += mx - mn; satCount++;
      }
      grays.push(g);
      onProgress(i / n * 0.8);
    }
    return { grays, colourfulness: satCount ? satSum / satCount : 0 };
  }

  async function readAudioRms(file, duration) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      const actx = new AC();
      const buf = await actx.decodeAudioData(await file.arrayBuffer());
      actx.close && actx.close();
      const sr = buf.sampleRate, len = buf.length, chans = buf.numberOfChannels;
      const mono = new Float32Array(len);
      for (let c = 0; c < chans; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < len; i++) mono[i] += d[i] / chans;
      }
      const secs = Math.max(1, Math.ceil(duration));
      const out = [];
      for (let s = 0; s < secs; s++) {
        const a = Math.floor(s * sr), b = Math.min(len, Math.floor((s + 1) * sr));
        if (a >= len) break;
        let sum = 0;
        for (let i = a; i < b; i++) sum += mono[i] * mono[i];
        const r = Math.sqrt(sum / Math.max(1, b - a)) + 1e-9;
        out.push(20 * Math.log10(r));
      }
      return out;
    } catch (e) {
      return null; // no decodable audio track
    }
  }

  // ---------- analysis (mirrors scripts/virality/analyze.py) ----------
  function analyse(frames, duration, rms, meta) {
    const grays = frames.grays, n = grays.length;
    const diffs = [];
    for (let i = 0; i + 1 < n; i++) {
      let s = 0; const a = grays[i], b = grays[i + 1];
      for (let p = 0; p < a.length; p++) s += Math.abs(b[p] - a[p]);
      diffs.push(s / a.length);
    }
    const motion = n > 1 ? [diffs[0], ...diffs] : [0];
    const dmax = Math.max(1e-6, ...diffs);
    const cutTimes = [];
    diffs.forEach((d, i) => { if (d > CUT_T * dmax && d > 0.08) cutTimes.push(+((i + 1) / SAMPLE_FPS).toFixed(2)); });

    const contrast = mean(grays.map(g => std(Array.from(g))));
    const colourfulness = frames.colourfulness;
    const brightness = mean(grays.map(g => mean(Array.from(g))));
    const balance = 1 - Math.abs(brightness - 0.5) * 2;
    const visual = 100 * (0.40 * clamp(contrast / 0.18) + 0.35 * clamp(colourfulness / 0.25) + 0.25 * clamp(balance));

    const motionMean = mean(motion);
    const staticShare = motion.filter(v => v < 0.01).length / motion.length;
    const cutDensity = cutTimes.length / Math.max(duration, 1) * 10;
    const attention = 100 * clamp(0.45 * clamp(motionMean / 0.04) + 0.30 * clamp(cutDensity / 4) + 0.25 * (1 - staticShare));

    let audioDyn = 0, audioPresent = 0, hasAudio = false;
    if (rms && rms.length) {
      hasAudio = true;
      const silence = rms.filter(v => v < -50).length / rms.length;
      audioDyn = clamp(std(rms) / 6);
      audioPresent = 1 - silence;
    }
    const memory = 100 * clamp(0.40 * clamp(cutDensity / 4) + 0.30 * audioDyn + 0.15 * audioPresent + 0.15 * clamp(colourfulness / 0.25));

    const head = motion.slice(0, SAMPLE_FPS * 3);
    const hookMotion = mean(head);
    const hookContrast = mean(grays.slice(0, SAMPLE_FPS * 3).map(g => std(Array.from(g))));
    const hook = 100 * clamp(0.6 * clamp(hookMotion / 0.04) + 0.4 * clamp(hookContrast / 0.18));

    const overall = 0.25 * visual + 0.35 * attention + 0.15 * memory + 0.25 * hook;

    const secs = Math.max(1, Math.ceil(duration));
    const eng = [];
    for (let s = 0; s < secs; s++) {
      const slice = motion.slice(s * SAMPLE_FPS, (s + 1) * SAMPLE_FPS);
      eng.push(clamp(mean(slice) / 0.04));
    }
    const curve = [100];
    let v = 100;
    eng.forEach(e => { v *= 1 - (0.02 + 0.06 * (1 - e)); curve.push(v); });

    let weakest = 0;
    eng.forEach((e, i) => { if (e < eng[weakest]) weakest = i; });

    const marks = [0, 3, 6, 10, 14, 21].filter(s => s <= Math.floor(duration));
    if (!marks.includes(Math.floor(duration))) marks.push(Math.floor(duration));
    return {
      scores: { overall: Math.round(overall), visual: Math.round(visual), attention: Math.round(attention), memory: Math.round(memory), hook: Math.round(hook) },
      details: {
        cuts: cutTimes.length, cutTimes, staticPct: Math.round(staticShare * 100),
        contrast: +contrast.toFixed(3), colourfulness: +colourfulness.toFixed(3),
        audioPct: hasAudio ? Math.round(audioDyn * 100) : null, hasAudio,
        weakest: fmtT(weakest), weakestIdx: weakest
      },
      marks: marks.map(s => ({ t: s, label: fmtT(s), retention: +curve[Math.min(s, curve.length - 1)].toFixed(1) })),
      curve, meta
    };
  }

  // ---------- rendering ----------
  let last = null;
  const $ = id => document.getElementById(id);

  function render(r) {
    const s = r.scores, d = r.details;
    // ring
    const off = 314 - 314 * (s.overall / 100);
    $("ringArc").style.transition = "stroke-dashoffset .8s ease";
    $("ringArc").setAttribute("stroke-dashoffset", off.toFixed(1));
    $("ringNum").textContent = s.overall;
    const verdict = s.overall >= 85 ? ["verdictHigh", ""] : s.overall >= 70 ? ["verdictMid", "mid"] : ["verdictLow", "low"];
    $("verdictTxt").textContent = `${s.overall} / 100`;
    $("verdict").textContent = t(verdict[0]);
    $("verdict").className = "verdict " + verdict[1];
    $("metaTxt").textContent = `${r.meta.name} · ${r.meta.w}×${r.meta.h} · ${r.meta.duration.toFixed(1)}s`;

    // chips
    const chips = $("chips");
    chips.innerHTML = "";
    r.marks.forEach((m, i) => {
      const isWeak = d.weakestIdx === m.t || (d.weakestIdx >= m.t && (i === r.marks.length - 1 || d.weakestIdx < r.marks[i + 1].t));
      const div = document.createElement("div");
      div.className = "chip" + (isWeak && m.retention < 50 ? " weak" : "");
      div.innerHTML = `<div class="t">${m.label}</div><div class="p">${Math.round(m.retention)}%</div><div class="b"><i style="width:${m.retention}%"></i></div>`;
      chips.appendChild(div);
    });

    // curve
    const svg = $("curveSvg");
    const w = 600, h = 160, pad = 8;
    const n = r.curve.length;
    const pts = r.curve.map((v, i) => `${(pad + (w - 2 * pad) * (i / Math.max(1, n - 1))).toFixed(1)},${(pad + (h - 2 * pad) * (1 - v / 100)).toFixed(1)}`);
    svg.innerHTML = `
      <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="var(--teal)" stop-opacity=".35"/><stop offset="1" stop-color="var(--teal)" stop-opacity="0"/></linearGradient></defs>
      <polygon points="${pad},${h - pad} ${pts.join(" ")} ${w - pad},${h - pad}" fill="url(#g)"></polygon>
      <polyline points="${pts.join(" ")}" fill="none" stroke="var(--teal2)" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>`;

    // signals
    const sig = [["visual", s.visual], ["attention", s.attention], ["memory", s.memory], ["hook", s.hook]];
    $("signals").innerHTML = sig.map(([k, v]) => `
      <div class="sig"><span class="n">${t(k)}</span><span class="v">${v}%</span>
        <div class="track"><i style="width:${v}%"></i></div></div>`).join("");

    // details
    const cutsTxt = d.cutTimes.length ? d.cutTimes.slice(0, 8).map(x => x + "s").join(", ") : t("none");
    $("details").innerHTML = `
      <dt>${t("cuts")}</dt><dd>${d.cuts}${d.cuts ? " — " + cutsTxt : ""}</dd>
      <dt>${t("staticTime")}</dt><dd>${d.staticPct}%</dd>
      <dt>${t("contrast")}</dt><dd>${d.contrast}</dd>
      <dt>${t("colour")}</dt><dd>${d.colourfulness}</dd>
      <dt>${t("audio")}</dt><dd>${d.hasAudio ? d.audioPct + "%" : t("none")}</dd>
      <dt>${t("weakest")}</dt><dd>${d.weakest}</dd>`;

    // tips
    const tips = [];
    if (s.hook < 50) tips.push(t("tipHook"));
    if (d.staticPct > 60) tips.push(t("tipStatic"));
    if (d.cuts < 2) tips.push(t("tipCuts"));
    if (d.contrast < 0.1) tips.push(t("tipContrast"));
    if (d.hasAudio && d.audioPct < 20) tips.push(t("tipAudio"));
    if (d.weakestIdx > 0) tips.push(t("tipWeak").replace("{s}", d.weakest));
    if (!tips.length) tips.push(t("tipGood"));
    $("tips").innerHTML = tips.map(x => `<li>${x}</li>`).join("");

    $("stage").classList.remove("hidden");
    $("jsonBtn").disabled = false;
  }

  // ---------- flow ----------
  let currentUrl = null;
  async function run(file) {
    const status = $("status"), prog = $("prog"), bar = prog.querySelector("i");
    status.className = "status"; status.textContent = t("loading");
    prog.classList.remove("hidden"); bar.style.width = "0%";
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(file);

    const video = $("vid");
    video.src = currentUrl;
    video.muted = true;
    try {
      await new Promise((res, rej) => {
        video.onloadedmetadata = () => res();
        video.onerror = () => rej(new Error(t("noVideo")));
      });
      const realDur = video.duration;
      if (!isFinite(realDur) || realDur <= 0) throw new Error(t("noVideo"));
      const duration = Math.min(realDur, MAX_SECONDS);
      if (realDur > MAX_SECONDS) status.textContent = t("tooLong");

      $("phoneEmpty").classList.add("hidden");
      status.textContent = t("analysing");
      const frames = await readFrames(video, duration, p => { bar.style.width = (p * 100).toFixed(0) + "%"; });

      status.textContent = t("audioStep");
      const rms = await readAudioRms(file, duration);
      bar.style.width = "100%";

      last = analyse(frames, duration, rms, {
        name: file.name, w: video.videoWidth, h: video.videoHeight, duration: realDur
      });
      render(last);
      status.textContent = t("done");
      prog.classList.add("hidden");
    } catch (e) {
      prog.classList.add("hidden");
      status.className = "status err";
      status.textContent = t("err") + e.message;
    }
  }

  function pick(f) { if (f) run(f); }

  $("file").addEventListener("change", e => pick(e.target.files[0]));
  $("pickBtn").addEventListener("click", () => $("file").click());
  $("drop").addEventListener("click", () => $("file").click());
  ["dragenter", "dragover"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
  $("drop").addEventListener("drop", e => pick(e.dataTransfer.files[0]));

  $("langBtn").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; applyLang(); });

  $("jsonBtn").addEventListener("click", () => {
    if (!last) return;
    const blob = new Blob([JSON.stringify(last, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "virality-report.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  applyLang();
})();
</script>
